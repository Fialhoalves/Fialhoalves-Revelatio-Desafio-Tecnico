databases:
  - name: taskmanager-db
    plan: free
    databaseName: taskmanager
    user: taskmanager

services:
  - type: web
    name: taskmanager-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: database
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
